name: flashi_mobile
description: Flashi — Plataforma Mobile Offline-First de Repetição Espaçada (FSRS-6) com Design Futurista Spatial Aurora.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend, Auth, Storage & Edge Functions (Contrato barrosrafa/Flashi)
  supabase_flutter: ^2.8.0
  http: ^1.2.2

  # Persistência Local Offline-First (SQLite ACID + 28 Tabelas Sync + Outbox)
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Arquitetura MVVM, DI & Navegação Declarativa
  provider: ^6.1.2
  get_it: ^8.0.2
  go_router: ^14.6.0

  # Utilitários de Criptografia (SHA-256), Identificadores & Rede
  crypto: ^3.0.6
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  intl: ^0.19.0

  # Mídia, Arquivos (.apkg / PDF / CSV / Imagens) & Compartilhamento
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

  # Renderização de Cartões (Markdown, Fórmulas KaTeX/LaTeX & Gráficos)
  flutter_markdown: ^0.7.4+1
  flutter_math_fork: ^0.7.3
  fl_chart: ^0.69.2

  # Design System Spatial Aurora (Tipografia & Ícones)
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^1.2.4

  # Observabilidade & Telemetria (Sentry + PostHog)
  sentry_flutter: ^8.11.0
  posthog_flutter: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/flashi-512.png"
  adaptive_icon_background: "#05070E"
  adaptive_icon_foreground: "assets/icons/flashi-512.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#05070E"
  image: "assets/icons/flashi-512.png"
  color_dark: "#05070E"
  image_dark: "assets/icons/flashi-512.png"
  android_12:
    color: "#05070E"
    icon_background_color: "#05070E"
    image: "assets/icons/flashi-512.png"

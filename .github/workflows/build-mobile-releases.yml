name: Build Flashi Mobile Releases (APK, AAB & IPA)

on:
  push:
    branches: [ main, feat/* ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Analyze & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Linux SQLite FFI for Unit Tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Install Dependencies
        run: flutter pub get
      - name: Static Analysis
        run: flutter analyze
      - name: Run Unit & Widget Tests
        run: flutter test

  build-android:
    name: Build Android APK & AppBundle
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Dependencies
        run: flutter pub get
      - name: Build Split APKs & Universal APK
        run: |
          flutter build apk --release \
            --dart-define=NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --dart-define=NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --dart-define=NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }} \
            --dart-define=NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      - name: Build Android App Bundle (.aab)
        run: |
          flutter build appbundle --release \
            --dart-define=NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --dart-define=NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --dart-define=NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }} \
            --dart-define=NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
      - name: Upload Android Artifacts (APK + AAB)
        uses: actions/upload-artifact@v4
        with:
          name: flashi-android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

  build-ios:
    name: Build iOS IPA
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install Dependencies & CocoaPods
        run: |
          flutter pub get
          cd ios && pod install
      - name: Build Unsigned iOS Archive (or Signed IPA when Apple Secrets present)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --dart-define=NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --dart-define=NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }} \
            --dart-define=NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          mkdir -p build/ios/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios && zip -r flashi_mobile.ipa Payload
      - name: Upload iOS Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: flashi-ios-ipa
          path: build/ios/flashi_mobile.ipa
